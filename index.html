
<!DOCTYPE html>
<html>
<head>
    <title>Recipe Management System</title>
    <style>
        body {
            font-family: Arial;
            background: #f3eaff;
            margin: 20px;
            color: #333;
        }
        h1, h2 { color: #6a0dad; }
        .container {
            max-width: 800px;
            margin: auto;
        }
        form, .recipe {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 6px #d5c1e8;
        }
        input, textarea, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        input, textarea {
            width: 100%;
            border: 1px solid #b99adf;
            border-radius: 5px;
        }
        button {
            background: #6a0dad;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #4b087d; }
        img {
            max-width: 200px;
            display: block;
            margin: 10px 0;
            border-radius: 8px;
        }
        #search { margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">

    <h1>My Recipe Book</h1>

    <h2 id="formTitle">Add a Recipe</h2>

    <form id="recipeForm">
        <input id="title" placeholder="Recipe Title" required>
        <textarea id="ingredients" placeholder="Ingredients" required></textarea>
        <textarea id="instructions" placeholder="Instructions" required></textarea>
        <input id="image" type="file" accept="image/*">
        <button type="submit">Save Recipe</button>
        <button type="button" onclick="resetForm()">Clear</button>
    </form>

    <h2>My Recipes</h2>
    <input id="search" placeholder="Search recipes..." oninput="displayRecipes()">

    <div id="recipes"></div>

</div>

<script>
let recipes = JSON.parse(localStorage.getItem("recipes")) || [];
let editId = null;
let imageData = "";

document.getElementById("image").onchange = function() {
    let file = this.files[0];
    if (file) {
        let reader = new FileReader();
        reader.onload = () => imageData = reader.result;
        reader.readAsDataURL(file);
    }
};

document.getElementById("recipeForm").onsubmit = function(e) {
    e.preventDefault();

    let recipe = {
        id: editId || Date.now(),
        title: document.getElementById("title").value.trim(),
        ingredients: document.getElementById("ingredients").value.trim(),
        instructions: document.getElementById("instructions").value.trim(),
        image: imageData
    };

    if (editId) {
        let old = recipes.find(r => r.id === editId);
        if (!imageData) recipe.image = old.image;
        recipes = recipes.map(r => r.id === editId ? recipe : r);
    } else {
        recipes.push(recipe);
    }

    localStorage.setItem("recipes", JSON.stringify(recipes));
    resetForm();
    displayRecipes();
};

function displayRecipes() {
    let search = document.getElementById("search").value.toLowerCase();
    let box = document.getElementById("recipes");
    box.innerHTML = "";

    recipes.filter(r =>
        r.title.toLowerCase().includes(search) ||
        r.ingredients.toLowerCase().includes(search)
    ).forEach(r => {
        box.innerHTML += `
        <div class="recipe">
            <h2>${escapeHTML(r.title)}</h2>
            ${r.image ? `<img src="${r.image}" alt="Recipe image">` : ""}
            <p><b>Ingredients:</b><br>${escapeHTML(r.ingredients).replace(/\n/g, "<br>")}</p>
            <p><b>Instructions:</b><br>${escapeHTML(r.instructions).replace(/\n/g, "<br>")}</p>
            <button onclick="editRecipe(${r.id})">Edit</button>
            <button onclick="deleteRecipe(${r.id})">Delete</button>
        </div>`;
    });
}

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
    }[c]));
}

function editRecipe(id) {
    let r = recipes.find(r => r.id === id);
    document.getElementById("title").value = r.title;
    document.getElementById("ingredients").value = r.ingredients;
    document.getElementById("instructions").value = r.instructions;
    editId = id;
    imageData = "";
    document.getElementById("formTitle").innerText = "Edit Recipe";
    window.scrollTo(0, 0);
}

function deleteRecipe(id) {
    if (confirm("Delete this recipe?")) {
        recipes = recipes.filter(r => r.id !== id);
        localStorage.setItem("recipes", JSON.stringify(recipes));
        displayRecipes();
    }
}

function resetForm() {
    document.getElementById("recipeForm").reset();
    editId = null;
    imageData = "";
    document.getElementById("formTitle").innerText = "Add a Recipe";
}

displayRecipes();
</script>
</body>
</html>
